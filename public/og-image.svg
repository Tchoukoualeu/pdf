<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,400&amp;family=Outfit:wght@400;500&amp;display=swap");
    .serif { font-family: "Fraunces", Georgia, "Times New Roman", serif; }
    .sans { font-family: "Outfit", Helvetica, Arial, sans-serif; }
  </style>

  <rect width="1200" height="630" fill="#F2EFE7"/>
  <circle cx="1140" cy="-70" r="320" fill="#D5E7E4"/>
  <circle cx="40" cy="700" r="240" fill="#FBFAF3"/>

  <!-- Wordmark -->
  <g>
    <rect x="78" y="66" width="17" height="23" rx="2" fill="#C8DFDB" stroke="#14242F" stroke-width="2"/>
    <rect x="87" y="72" width="17" height="23" rx="2" fill="#FDFDFA" stroke="#14242F" stroke-width="2"/>
    <path d="M92 80h7M92 85h7" stroke="#3368A0" stroke-width="2" stroke-linecap="round"/>
    <text class="serif" x="120" y="91" font-size="30" font-weight="600" fill="#14242F">
      Split PDF in <tspan font-style="italic" font-weight="400" fill="#27527F">2</tspan>
    </text>
  </g>

  <!-- Headline -->
  <text class="serif" x="78" y="290" font-size="78" font-weight="500" fill="#14242F">Split a PDF into</text>
  <text class="serif" x="78" y="382" font-size="78" font-weight="500" fill="#14242F">
    <tspan font-style="italic" font-weight="400" fill="#27527F">2 files</tspan> online free
  </text>
  <text class="sans" x="78" y="466" font-size="26" fill="#46606F">
    Free in-browser PDF splitter — one page becomes one file, nothing is uploaded.
  </text>

  <!-- Two pages, split -->
  <g transform="translate(950 300)">
    <g transform="rotate(-8 -70 0)">
      <rect x="-140" y="-105" width="140" height="210" rx="8" fill="#FDFDFA" stroke="#A9C4C0" stroke-width="2"/>
      <path d="M-115 -65h64M-115 -35h90M-115 -5h74" stroke="#3C5A68" stroke-width="8" stroke-linecap="round" opacity=".85"/>
      <path d="M-115 25h90M-115 55h56" stroke="#CCDCD9" stroke-width="8" stroke-linecap="round"/>
    </g>
    <g transform="rotate(8 70 0)">
      <rect x="0" y="-105" width="140" height="210" rx="8" fill="#FDFDFA" stroke="#A9C4C0" stroke-width="2"/>
      <path d="M25 -65h64M25 -35h90M25 -5h74" stroke="#3C5A68" stroke-width="8" stroke-linecap="round" opacity=".85"/>
      <path d="M25 25h90M25 55h56" stroke="#CCDCD9" stroke-width="8" stroke-linecap="round"/>
    </g>
    <path d="M0 -130V130" stroke="#3368A0" stroke-width="3" stroke-dasharray="10 10" stroke-linecap="round"/>
  </g>
</svg>
