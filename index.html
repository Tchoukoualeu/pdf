<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Experience — Split by page</title>
    <meta
      name="description"
      content="Split a PDF into one file per page. A 3-page document becomes 3 PDFs."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231A1814'/%3E%3Crect x='8' y='6' width='16' height='20' rx='1.5' fill='%23F7F3EB'/%3E%3Cpath d='M8 18h16' stroke='%23C45C26' stroke-width='1.5'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,400&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <div class="app">
      <header class="top">
        <a class="wordmark" href="./">
          <span class="wordmark-mark" aria-hidden="true"></span>
          PDF Experience
        </a>
        <p class="top-note">Runs in your browser. Files never leave this device.</p>
      </header>

      <main>
        <section class="hero">
          <p class="eyebrow">Page splitter</p>
          <h1>One page.<br /><em>One file.</em></h1>
          <p class="lede">
            Drop a PDF. If it has 3 pages, you get 3 PDFs — each page on its own
            file.
          </p>
        </section>

        <section id="stage" class="stage">
          <div id="dropzone" class="dropzone" role="button" tabindex="0">
            <input
              id="file-input"
              type="file"
              accept="application/pdf,.pdf"
              hidden
            />
            <div class="sheet" aria-hidden="true">
              <span class="sheet-rule"></span>
              <span class="sheet-rule"></span>
              <span class="sheet-rule"></span>
            </div>
            <div class="drop-copy">
              <p class="drop-title">Drop a PDF here</p>
              <p class="drop-sub">or click to choose a file</p>
            </div>
          </div>
          <p id="sample-row" class="sample-row">
            <button type="button" id="try-sample" class="text-link">
              Try a 3-page sample
            </button>
          </p>

          <div id="status" class="status" hidden></div>

          <div id="results" class="results" hidden>
            <div class="results-bar">
              <div>
                <p id="results-title" class="results-title"></p>
                <p id="results-meta" class="results-meta"></p>
              </div>
              <div class="results-actions">
                <button type="button" id="download-all" class="btn btn-primary">
                  Download all
                </button>
                <button type="button" id="reset" class="btn btn-ghost">
                  Split another
                </button>
              </div>
            </div>
            <ul id="page-grid" class="page-grid"></ul>
          </div>
        </section>
      </main>

      <footer class="foot">
        <p>Split happens locally. Nothing is uploaded.</p>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
